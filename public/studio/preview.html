<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TikTok Radar — Recommendation Engine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #090b10; color: #f1f5f9; padding: 20px 24px; }
    
    header { 
      max-width: 1040px; 
      margin: 0 auto 14px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      border-bottom: 1px solid #1a202c; 
      padding-bottom: 12px; 
    }
    h1 { font-size: 18px; font-weight: 700; color: #fff; }
    .header-sub { font-size: 12px; color: #64748b; margin-top: 2px; }

    .header-actions { display: flex; align-items: center; gap: 10px; }
    .sync-btn { background: #0284c7; color: #fff; border: none; padding: 6px 14px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; transition: background 0.15s ease; }
    .sync-btn:hover { background: #0369a1; }
    .sync-btn:disabled { background: #334155; cursor: not-allowed; opacity: 0.6; }

    /* Filter Strip */
    .filter-bar {
      max-width: 1040px;
      margin: 0 auto 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .filter-group { display: flex; gap: 6px; }
    .filter-btn {
      background: #151b28;
      border: 1px solid #242e42;
      color: #94a3b8;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .filter-btn:hover { background: #1c2436; color: #e2e8f0; }
    .filter-btn.active {
      background: #0284c7;
      color: #fff;
      border-color: #38bdf8;
    }

    .grid { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }

    .row { 
      background: #111520; 
      border: 1px solid #1c2333; 
      border-radius: 8px; 
      display: flex; 
      flex-direction: row; 
      overflow: hidden; 
      transition: border-color 0.15s ease, background 0.15s ease;
      height: 125px;
    }
    .row:hover { border-color: #38bdf8; background: #131926; }

    .video-thumb { 
      position: relative; 
      width: 90px; 
      min-width: 90px; 
      height: 125px; 
      background: #000; 
      cursor: pointer; 
      overflow: hidden; 
    }
    .video-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .rank-badge { 
      position: absolute; 
      top: 4px; 
      left: 4px; 
      background: rgba(0,0,0,0.8); 
      color: #38bdf8; 
      font-size: 10px; 
      font-weight: 700; 
      padding: 1px 5px; 
      border-radius: 3px; 
    }

    .content { 
      padding: 10px 14px; 
      flex: 1; 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between; 
      min-width: 0;
    }

    .top-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .creator-group { display: flex; align-items: center; gap: 8px; }
    .avatar { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; }
    .handle { font-size: 13px; font-weight: 700; color: #f8fafc; text-decoration: none; }
    .handle:hover { color: #38bdf8; text-decoration: underline; }

    .tags-group { display: flex; align-items: center; gap: 6px; }
    .score-badge {
      background: #38bdf818;
      color: #38bdf8;
      border: 1px solid #38bdf840;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
    }

    .signal-pill { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 4px; }
    .signal-red { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    .signal-purple { background: rgba(168, 85, 247, 0.15); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.3); }
    .signal-emerald { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .signal-blue { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
    .signal-gray { background: #1e293b; color: #94a3b8; border: 1px solid #334155; }

    .caption-snippet { font-size: 12px; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 4px 0; }
    .recommendation { font-size: 11px; font-weight: 600; color: #38bdf8; margin-bottom: 2px; }
    .delta-badge { background: #10b98125; color: #34d399; border: 1px solid #10b98140; font-size: 10px; padding: 1px 6px; border-radius: 4px; font-weight: 600; margin-left: 6px; }

    .bottom-bar { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #182030; padding-top: 6px; font-size: 11px; }
    .metrics { display: flex; gap: 10px; color: #64748b; }
    .metrics span strong { color: #e2e8f0; font-weight: 600; }
    .metrics .velocity strong { color: #38bdf8; }
    .metrics .er strong { color: #34d399; }
    .metrics .shares strong { color: #c084fc; }

    .action-link { color: #38bdf8; text-decoration: none; font-weight: 600; font-size: 11px; }
    .action-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>TikTok Viral Feed Discovery</h1>
      <div class="header-sub">Algorithmic scoring combining velocity, engagement rate, and share ratios</div>
    </div>
    <div class="header-actions">
      <button onclick="this.innerText='🤖 Generating...'; fetch('/api/run-ai', {method:'POST'}).then(()=>location.reload())" style="background: #8b5cf6; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-bottom: 12px;">🤖 Generate AI Briefs</button>
    </div>
  </header>

  <div class="filter-bar">
    <div class="filter-group">
      <button class="filter-btn active" id="f-top10" onclick="setFilter('top10')">⭐ Top 10 Recommended</button>
      <button class="filter-btn" id="f-velocity" onclick="setFilter('velocity')">🚀 Fastest Velocity</button>
      <button class="filter-btn" id="f-shares" onclick="setFilter('shares')">🔁 High Shares</button>
      <button class="filter-btn" id="f-er" onclick="setFilter('er')">🔥 Highest ER</button>
      <button class="filter-btn" id="f-all" onclick="setFilter('all')">All Items</button>
    </div>
    <span id="count-tag" style="font-size: 12px; color: #64748b;">Loading...</span>
  </div>

  <div class="grid" id="container"></div>

  <script>
    let allItems = [];
    let currentFilter = 'top10';

    async function loadData() {
      const res = await fetch('/api/briefs');
      allItems = await res.json();
      render();
    }

    function setFilter(type) {
      currentFilter = type;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('f-' + type).classList.add('active');
      render();
    }

    function render() {
      let list = [...allItems];

      if (currentFilter === 'top10') {
        list.sort((a, b) => (b.opportunityScore || 0) - (a.opportunityScore || 0));
        list = list.slice(0, 10);
      } else if (currentFilter === 'velocity') {
        list.sort((a, b) => b.viewsPerDayRaw - a.viewsPerDayRaw);
      } else if (currentFilter === 'shares') {
        list.sort((a, b) => (b.shareRatioNum || 0) - (a.shareRatioNum || 0));
      } else if (currentFilter === 'er') {
        list.sort((a, b) => (b.erNum || 0) - (a.erNum || 0));
      }

      document.getElementById('count-tag').textContent = `Showing ${list.length} videos`;

      const container = document.getElementById('container');
      container.innerHTML = list.map((item, idx) => `
        <div class="row">
          <div class="video-thumb" 
               onclick="window.open('${item.media.webUrl}', '_blank')"
               onmouseenter="playPreview(this, '${item.media.animatedCoverUrl}')"
               onmouseleave="stopPreview(this, '${item.media.coverUrl}')">
            <span class="rank-badge">#${idx + 1}</span>
            <img src="${item.media.coverUrl}" alt="Thumbnail" referrerpolicy="no-referrer" />
          </div>

          <div class="content">
            <div class="top-bar">
              <div class="creator-group">
                ${item.creator.avatar ? `<img src="${item.creator.avatar}" class="avatar" referrerpolicy="no-referrer" />` : ''}
                <a href="${item.media.webUrl}" target="_blank" class="handle">${item.creator.handle}</a>
                
                ${item.deltaText ? `<span class="delta-badge">${item.deltaText}</span>` : ''}
              </div>
              <div class="tags-group">
                <span class="score-badge">Score: ${item.opportunityScore || 0}</span>
                <span class="signal-pill signal-${item.signalColor}">${item.signalTag}</span>
              </div>
            </div>

            <div>
              <div class="recommendation">👉 ${item.recommendation}</div>
              <div class="caption-snippet">${item.caption || 'No caption'}</div>
            </div>

            <div class="bottom-bar">
              <div class="metrics">
                
<span>Age: <strong>${item.ageDisplay}</strong></span>
                <span class="velocity">Speed: <strong>${item.velocityDisplay}</strong></span>
                <span>Views: <strong>${item.metrics.views}</strong></span>
                <span class="shares">Shares: <strong>${item.metrics.shares} (${item.metrics.shareRate})</strong></span>
                <span class="er">ER: <strong>${item.metrics.er}</strong></span>
              </div>
              <a href="${item.media.webUrl}" target="_blank" class="action-link">Open Post ↗</a>
            </div>
          </div>
        </div>
      `).join('');
    }

    async function syncHar() {
      const btn = document.getElementById('syncBtn');
      btn.disabled = true;
      btn.textContent = '⏳ Processing HAR...';
      try {
        const res = await fetch('/api/sync-har', { method: 'POST' });
        const data = await res.json();
        if (data.success) {
          btn.textContent = `✓ Synced (${data.file})`;
          setTimeout(() => { btn.textContent = '⚡ Sync Latest HAR'; btn.disabled = false; }, 3000);
          await loadData();
        } else {
          alert(data.error || 'Sync failed.');
          btn.textContent = '⚡ Sync Latest HAR';
          btn.disabled = false;
        }
      } catch (err) {
        alert('Could not contact server.');
        btn.textContent = '⚡ Sync Latest HAR';
        btn.disabled = false;
      }
    }

    function playPreview(el, animUrl) { if (animUrl) el.querySelector('img').src = animUrl; }
    function stopPreview(el, coverUrl) { if (coverUrl) el.querySelector('img').src = coverUrl; }

    loadData();
  </script>
</body>
</html>
